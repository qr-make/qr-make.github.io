<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
      font-family: system-ui, sans-serif;
      background: #09090b;
      color: #fafafa;
    }

    #qr-wrap {
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: width 0.15s, height 0.15s;
    }

    #qrcode {
      display: block;
    }

    .size-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 320px;
    }

    #size-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: #3f3f46;
      outline: none;
    }

    #size-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fafafa;
      border: 2px solid #27272a;
      cursor: pointer;
    }

    #size-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fafafa;
      border: 2px solid #27272a;
      cursor: pointer;
    }

    #size-value {
      font-size: 12px;
      color: #71717a;
      min-width: 52px;
      text-align: right;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 320px;
    }

    #link {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      font-family: inherit;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background: #18181b;
      color: #a1a1aa;
    }

    #link:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.2);
      color: #fafafa;
    }

    #dl-btn {
      width: 40px;
      min-width: 40px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background: #18181b;
      color: #a1a1aa;
      cursor: pointer;
    }

    #dl-btn:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: #fafafa;
    }
  </style>
</head>
<body>
  <div id="qr-wrap">
    <canvas id="qrcode"></canvas>
  </div>

  <div class="size-row">
    <input type="range" id="size-slider" min="0" max="1" value="0" step="1">
    <span id="size-value">Обычный</span>
  </div>

  <div class="row">
    <input id="link" placeholder="://">
    <button id="dl-btn">↶</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
  <script>
    const canvas = document.getElementById('qrcode');
    const wrap = document.getElementById('qr-wrap');
    const input = document.getElementById('link');
    const dlBtn = document.getElementById('dl-btn');
    const slider = document.getElementById('size-slider');
    const sizeValue = document.getElementById('size-value');
    const sizes = [250, 400];
    const labels = ['Обычный', 'Большой'];

    function createQRCode() {
      const baseSize = sizes[parseInt(slider.value)];
      sizeValue.textContent = labels[parseInt(slider.value)];

      const tempCanvas = document.createElement('canvas');
      const tempQR = new QRious({
        element: tempCanvas,
        value: input.value || ' ',
        size: baseSize,
        padding: 0
      });

      const tempCtx = tempCanvas.getContext('2d');
      const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
      const data = imageData.data;

      let minX = tempCanvas.width;
      let minY = tempCanvas.height;
      let maxX = 0;
      let maxY = 0;

      for (let y = 0; y < tempCanvas.height; y++) {
        for (let x = 0; x < tempCanvas.width; x++) {
          const index = (y * tempCanvas.width + x) * 4;
          if (data[index] < 128) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      const qrWidth = maxX - minX + 1;
      const qrHeight = maxY - minY + 1;
      const padding = 40;
      const finalSize = Math.max(qrWidth, qrHeight) + padding;

      canvas.width = finalSize;
      canvas.height = finalSize;

      new QRious({
        element: canvas,
        value: input.value || ' ',
        size: finalSize,
        padding: Math.floor(padding / 2)
      });

      wrap.style.width = finalSize + 'px';
      wrap.style.height = finalSize + 'px';

      localStorage.setItem('qr-size', slider.value);
    }

    function downloadQR() {
      const a = document.createElement('a');
      a.download = 'qrcode.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      dlBtn.textContent = '✓';
      setTimeout(() => {
        dlBtn.textContent = '↶';
      }, 1000);
    }

    dlBtn.addEventListener('click', downloadQR);
    input.addEventListener('input', createQRCode);
    slider.addEventListener('input', createQRCode);

    const saved = localStorage.getItem('qr-size');
    if (saved !== null && saved <= 1) slider.value = saved;
    createQRCode();
  </script>
</body>
</html>
