<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Generator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
      font-family: 'Inter', system-ui, sans-serif;
      background: #09090b;
      color: #fafafa;
    }

    #qrcode {
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: #fff;
    }

    #link {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      font-family: inherit;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background: #18181b;
      color: #a1a1aa;
      transition: border-color 0.2s;
    }

    #link:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.2);
      color: #fafafa;
    }

    #link::placeholder {
      color: #a1a1aa;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 320px;
    }

    #dl-btn {
      width: 40px;
      min-width: 40px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background: #18181b;
      color: #a1a1aa;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    #dl-btn:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: #fafafa;
    }
  </style>
</head>
<body>
  <canvas id="qrcode"></canvas>
  <div class="row">
    <input id="link" placeholder="://">
    <button id="dl-btn">&#8630;</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
  <script>
    const canvas = document.getElementById('qrcode');
    const input = document.getElementById('link');
    const dlBtn = document.getElementById('dl-btn');

    function createQRCode() {
      new QRious({
        element: canvas,
        value: input.value,
        size: 500,
        padding: 50
      });
    }

    function downloadQR() {
      const a = document.createElement('a');
      a.download = 'qrcode.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      dlBtn.textContent = '\u2713';
      setTimeout(() => { dlBtn.textContent = '\u21BA'; }, 1000);
    }

    dlBtn.addEventListener('click', downloadQR);
    input.addEventListener('input', createQRCode);
    createQRCode();
  </script>
</body>
</html>
